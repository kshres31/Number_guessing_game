[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "number-guessing-game"
version = "1.0.0"
description = "A classic command line number guessing game"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "kshres31", email = "kshres31@gmail.com" },
]
keywords = ["game", "cli", "guessing-game"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]

[project.scripts]
guess-the-number = "number_guessing_game.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["number_guessing_game"]
